<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Pengaturan dasar dokumen web -->
    <meta charset="UTF-8">
    
    <!-- Pengaturan layar agar web tidak terpotong saat dibuka di HP (Responsif) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Judul yang akan muncul di tab atas browser pengunjung -->
    <title>CV Halmahera kelas 9</title>
    
    <!-- Mengambil koleksi ikon gratis dari internet (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Menghubungkan kerangka HTML ini dengan file desain CSS kita -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================== -->
    <!-- NAVBAR: Bagian menu navigasi di atas web -->
    <!-- ============================================== -->
    <nav class="navbar">     
        <div class="container nav-container">
            <!-- Teks logo yang jika diklik akan kembali ke atas (#) -->
            <a href="#" class="logo">Portfolio<span>.</span></a>
            
            <!-- Ikon garis tiga (burger) yang hanya muncul di layar HP -->
            <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>

            <!-- Daftar link menu (About, Experience, Contact) -->
            <ul class="nav-links" id="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#experience">Experience</a></li>
                <!-- Tombol khusus untuk menu Contact me -->
                <li><a href="#contact" class="btn btn-primary nav-btn">Contact me</a></li>
            </ul>
        </div>
    </nav>

    <!-- ============================================== -->
    <!-- HERO SECTION: Bagian penyambutan (paling atas) -->
    <!-- ============================================== -->
    <section class="hero" id="about">
        <div class="container hero-container">
            
            <!-- Kolom Teks Sambutan -->
            <div class="hero-content">
                <span class="badge">Selamat datang</span>
                <h1>Halo, Raka rafiiandra</h1>
                <h2>Siswa kelas 9 di SMPS Alam Purwakarta</h2>
                <p>Saya senang mempelajari hal baru dan terus berkembang.</p>
                <div class="hero-buttons">
                    <!-- Tombol yang mengarah ke bagian project -->
                    <a href="#projects" class="btn btn-primary">Project terdekat saya</a>
                </div>
            </div> 
            
            <!-- Kolom Foto Profil -->
            <div class="hero-image">
                <!-- Ganti link src ini dengan link foto aslimu nanti -->
                <img src="benzi.jpg" alt="profile">
            </div>
        </div>
    </section>


    <!-- Funding SECTION: Bagian poster dan link pendaftaran even berbayar -->

    <section class="funding" id="funding">
        <div class="container"
            <h2>Latest <span
            class="highlight"><Articles></span></h2>
            <div class="funding-grid">


               <div class="funding-card">
                <h3>Jalaan-jalan Purwakarta</h3>
               </div class="funding-image"
                <a href="#projects" class="btn btn-primary">Project terdekat saya</a>
                </div>
            </div> 
            </div>
        </div>
    </div>
</section>

<!-- FOTER: Bagian kaki web paling bawah -->

<footer>
    <div class="container">
        <p>&copy; Alan. Built with HTML & CSS.</p>
    </div>
</footer>
</body>
</html>
